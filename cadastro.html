<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - TechFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg bg-body border-bottom shadow-sm">
            <div class="container">
                <h1 class="h5 mb-0">
                    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
                        <img class="brand-logo" src="assets/Gemini_Generated_Image_jlvelwjlvelwjlve-removebg-preview.png" alt="">
                        <span>TechFlow</span>
                    </a>
                </h1>
                <a class="btn btn-outline-primary btn-sm px-3" href="login.html">Entrar</a>
            </div>
        </nav>
    </header>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Comece sua jornada na TechFlow</h2>
                <p class="text-body-secondary mb-0">Crie sua conta e explore nossos cursos de tecnologia.</p>
            </div>
            <div class="row justify-content-center">
                <section class="col-md-7 col-lg-5">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4 p-lg-5">
                            <h3 class="h4 fw-bold mb-1">Criar conta gratuita</h3>
                            <p class="text-body-secondary mb-4">Preencha seus dados para começar a aprender.</p>
                            <form action="perfil.html" method="get">
                                <div class="form-floating mb-3">
                                    <input type="text" class="form-control" id="cad-nome" name="nome" placeholder="Nome completo" required>
                                    <label for="cad-nome">Nome completo</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control" id="cad-email" name="email" placeholder="E-mail" required>
                                    <label for="cad-email">E-mail</label>
                                </div>
                                <div class="form-floating mb-3">
                                    <input type="password" class="form-control" id="cad-senha" name="senha" placeholder="Senha" required>
                                    <label for="cad-senha">Senha</label>
                                </div>
                                <div class="form-floating mb-4">
                                    <input type="password" class="form-control" id="cad-confirma-senha" name="confirma_senha" placeholder="Confirmar senha" required>
                                    <label for="cad-confirma-senha">Confirmar senha</label>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">Criar conta</button>
                            </form>
                            <p class="text-center text-body-secondary mt-4 mb-0">Já tem uma conta? <a href="login.html" class="fw-semibold">Entre</a></p>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="bg-body border-top py-4 mt-auto">
        <div class="container text-center">
            <a class="small link-secondary link-underline-opacity-0" href="index.html"><i class="bi bi-arrow-left me-1"></i>Voltar para a página inicial</a>
        </div>
    </footer>
</body>
</html>
