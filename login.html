<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - TechFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/styles.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg bg-body border-bottom shadow-sm">
            <div class="container">
                <h1 class="h5 mb-0">
                    <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
                        <img class="brand-logo" src="assets/Gemini_Generated_Image_jlvelwjlvelwjlve-removebg-preview.png" alt="">
                        <span>TechFlow</span>
                    </a>
                </h1>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav ms-auto gap-lg-2">
                        <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                        <li class="nav-item"><a class="nav-link" href="cursos.html">Cursos</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Boas-vindas de volta</h2>
                <p class="text-body-secondary mb-0">Entre na sua conta TechFlow para continuar aprendendo.</p>
            </div>

            <div class="row justify-content-center">
                <section class="col-md-7 col-lg-5">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4 p-lg-5">
                            <h3 class="h4 fw-bold mb-1">Entrar na sua conta</h3>
                            <p class="text-body-secondary mb-4">Acesse seus cursos e acompanhe sua jornada.</p>
                            <form action="cursos.html" method="get">
                                <div class="mb-3">
                                    <label for="login-email" class="form-label fw-medium">E-mail</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" id="login-email" name="email" required placeholder="seu@email.com">
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label for="login-senha" class="form-label fw-medium">Senha</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control" id="login-senha" name="senha" required placeholder="Sua senha">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm">Entrar</button>
                            </form>
                            <p class="text-center text-body-secondary mt-4 mb-0">Ainda não tem uma conta? <a href="cadastro.html" class="fw-semibold">Cadastre-se</a></p>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="bg-body border-top py-4 mt-auto">
        <div class="container text-center">
            <a class="small link-secondary link-underline-opacity-0" href="index.html"><i class="bi bi-arrow-left me-1"></i>Voltar para a página inicial</a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
